# Publishes site/ to GitHub Pages.
#
# "Deploy from a branch" only offers the repository root or /docs, and the
# site is neither: it lives in site/, away from the app and away from the
# developer documentation. Deploying through Actions is how Pages publishes an
# arbitrary folder, and it costs one small workflow.
#
# Set Settings -> Pages -> Source to "GitHub Actions" for this to take effect.
name: site

on:
  push:
    branches: [main]
    # Only when the site actually changes. A commit touching the app has no
    # business redeploying a static page.
    paths:
      - 'site/**'
      - 'scripts/siteRelease.mjs'
      - 'scripts/release/**'
      - '.github/workflows/site.yml'
  # A new release changes the version, size and checksum the page shows. Runs
  # after release-assets has given it papervoice.json, never alongside it.
  workflow_run:
    workflows: [release-assets]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one halfway: a cancelled deploy
# can leave the site serving a half-published state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # After a release, only if its assets were actually added.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The endpoints are filled in here rather than committed.
      #
      # Neither is a secret in the sense of a password -- the browser has to
      # POST to the one and open the other, so both are visible in the served
      # page, and nothing can change that about a static site. Keeping them
      # out of the repository keeps them out of git history and out of search
      # results for the source, which is worth having on its own.
      #
      # Settings -> Secrets and variables -> Actions -> New repository secret.
      # Missing, the step does nothing and the page keeps its fallbacks: the
      # form opens a mail client, and the beta line stays hidden.
      - name: Fill in the endpoints
        env:
          EARLY_ACCESS_ENDPOINT: ${{ secrets.EARLY_ACCESS_ENDPOINT }}
          BETA_OPT_IN_URL: ${{ secrets.BETA_OPT_IN_URL }}
        run: python3 scripts/fillEndpoints.py site/index.html EARLY_ACCESS_ENDPOINT BETA_OPT_IN_URL

      # Version, size, checksum and minimum Android, from the latest release's
      # papervoice.json. Fails -- and so stops the deploy -- when the stable APK
      # the download buttons point at does not resolve.
      - name: Fill in the release
        run: node scripts/siteRelease.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
