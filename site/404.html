<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Not found — Papervoice</title>
<meta name="robots" content="noindex">

<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#faf7f0">

<style>
  @font-face {
    font-family: 'Playfair';
    src: url('/fonts/playfair.woff2') format('woff2-variations');
    font-weight: 400 700;
    font-display: swap;
  }
  @font-face {
    font-family: 'Jost';
    src: url('/fonts/jost.woff2') format('woff2-variations');
    font-weight: 300 700;
    font-display: swap;
  }
  :root {
    --paper: #faf7f0;
    --ink: #1c1917;
    --muted: #57534e;
    --accent: #4f46e5;
    --highlight: #fde68a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Jost', -apple-system, 'Segoe UI', Roboto, sans-serif;
    font-size: 17px;
    line-height: 1.65;
    text-align: center;
    padding: 40px 24px;
    -webkit-font-smoothing: antialiased;
  }
  h1 {
    font-family: 'Playfair', Georgia, serif;
    font-weight: 500;
    font-size: clamp(2.2rem, 7vw, 3.2rem);
    line-height: 1.1;
    letter-spacing: -0.015em;
    margin: 0 0 14px;
  }
  .mark { background: linear-gradient(var(--highlight), var(--highlight)) no-repeat center / 100% 88%; padding: 0 0.08em; }
  p { color: var(--muted); max-width: 30em; margin: 0 auto 28px; }
  a.btn {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    font-weight: 600;
    text-decoration: none;
    padding: 15px 30px;
    border-radius: 999px;
  }
  a.btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .small { margin-top: 24px; font-size: 0.92rem; }
  .small a { color: var(--muted); }
</style>
</head>
<body>
  <main>
    <h1>This page is <span class="mark">not here</span>.</h1>
    <p>
      The link may be old, or mistyped. Nothing is broken on your side.
    </p>
    <a class="btn" href="/">Back to Papervoice</a>
    <p class="small">
      <a href="/privacy">Privacy</a> ·
      <a href="https://github.com/shashankappu21/papervoice">GitHub</a>
    </p>
  </main>
</body>
</html>
